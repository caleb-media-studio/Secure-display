name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package.json'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Reject suspicious tracked files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(\.env([^/]*$)|secrets/|private/)|\.(pem|p12|pfx|key|jks|keystore)$'; then
            echo 'Potential secret material was committed'; exit 1
          fi
