name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package.json'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node tools/check-secrets.mjs
      - name: Reject suspicious tracked files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(\.env([^/]*$)|secrets/|private/)|\.(pem|p12|pfx|key|jks|keystore)$'; then
            echo 'Potential secret material was committed'; exit 1
          fi

  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Rebuild and boot HTML element example from empty dist
        run: node tools/smoke-examples.mjs
      - name: Generate synthetic H.264 fixture without drawtext
        run: bun run fixture
